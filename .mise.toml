# Pinned toolchain. `mise install` gives every contributor and every CI job the
# same Node, so "works on my machine" is a statement about a version anyone can
# reproduce.
#
# The tasks below are the commands CI runs. Keeping them here rather than only
# in .gitlab-ci.yml means a maintainer can run exactly what the pipeline runs,
# and the pipeline stays a thin wrapper rather than a second source of truth.

[tools]
node = "22"

[tasks.install]
description = "Install dependencies with the manager package.json declares"
run = "corepack enable && corepack prepare --activate && npm ci"

[tasks.lint]
description = "Run every linter"
run = "npm run lint"

[tasks.test]
description = "Run the unit tests"
run = "npm test"

[tasks.validate]
description = "Validate every registry file"
run = "npm run validate"
