---
name: Metadata

# Everything a gate has to read from the pull request itself rather than from
# its commits or its files: the title a squash merge keeps as the subject on
# main, and the title and description that must not credit a tool as author.
#
# It is separate from ci.yml because it needs the edited activity type and
# ci.yml must not have it, for two reasons found the hard way. ci.yml cancels
# in progress on a group keyed by ref, so an edit arriving mid-run cancelled
# the validation run, and a replacement that skipped the validation jobs left
# nothing to replace it. And every bot that touches a description fired that
# second run, recording a row of skips against a commit that had already
# passed. druxt/druxt.js splits plan.yml out of its ci.yml for the same reason.
#
# synchronize is in the list even though a push changes neither field: a
# required check has to exist on the head commit, and a workflow firing only on
# opened and edited would leave the newest commit with no metadata check.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  # One run per pull request. An edit arriving while a run is still going
  # supersedes it, because the fields that run read are no longer the ones on
  # the pull request.
  #
  # The key is the number rather than github.ref, which for a pull_request
  # event is refs/pull/<number>/merge and so groups exactly the same runs. The
  # number is not the stronger key, it only names what the group is for, and
  # it is set because this workflow fires on nothing but pull_request.
  group: metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          # The attribution check reads the pull request's own commits, so its
          # base has to be present.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: corepack enable && corepack prepare --activate

      - run: npm ci

      # Through the environment, never interpolated into the script. A title is
      # whatever its author typed, and ${{ }} would paste it in as shell.
      - name: Lint the title a squash merge would keep
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run --silent lint:commit

      # The work is the author's. This runs here as well as in ci.yml's lint
      # job because only this workflow sees a description edit, and the
      # description is one of the places the check reads.
      - name: Check for AI attribution in the title and description
        env:
          ATTRIBUTION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_REQUEST_DESCRIPTION: ${{ github.event.pull_request.body }}
          MERGE_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: npm run lint:attribution
