---
# CI for the Druxt module registry. Two things have to hold on every merge
# request: the repository's own tooling is clean, and every registry file
# validates. The second is the one a contributor cares about, so it runs as its
# own job and its output is the whole answer to "why was my listing rejected".
#
# See the repository standard for what the lint jobs are for.

stages:
  - lint
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  tags: [docker]
  timeout: 10m
  before_script:
    - 'section_start() { local n="$1" t="${2:-$1}"; printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)" "$n" "$t"; }'
    - 'section_end() { printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)" "$1"; }'

# Shared Node setup. `corepack prepare --activate` reads the packageManager
# field rather than naming a manager here, so this block is identical in every
# repository whatever it installs with. The cache is keyed by the lockfile
# hash: a dependency bump misses once and hits thereafter.
.node:
  image: node:22
  interruptible: true
  variables:
    GIT_DEPTH: 0
  cache:
    key:
      files:
        - package-lock.json
      prefix: node-22
    paths:
      - .npm/
  before_script:
    - !reference [default, before_script]
    - corepack enable
    - corepack prepare --activate
    - npm ci --cache .npm --prefer-offline

lint:
  extends: .node
  stage: lint
  script:
    - section_start "js" "Linting scripts and tests"
    - npm run lint:js
    - section_end "js"
    - section_start "format" "Checking formatting"
    - npm run lint:format
    - section_end "format"
    - section_start "md" "Linting Markdown"
    - npm run lint:md
    - section_end "md"
    - section_start "cspell" "Spell-checking"
    - npm run lint:cspell
    - section_end "cspell"
    - section_start "private" "Checking for private references"
    - npm run lint:private
    - section_end "private"
    - section_start "attribution" "Checking for tool attribution"
    - npm run lint:attribution
    - section_end "attribution"

# On a merge request, the title and then the whole commit range. The title is
# what a squash merge keeps as the subject, and the range is what a merge commit
# keeps: a conventional head commit on top of three unconventional ones still
# breaks the squashed subject, and a prose title breaks it whatever the commits
# say. A branch pipeline has neither a title nor a diff base, so it lints the
# commits the push added instead. Skipping it there would leave a direct push to
# the default branch as the one way an unconventional subject reaches history
# unchecked.
lint:commit:
  extends: .node
  stage: lint
  script:
    - |
      # GitLab checks the exit status of each script item, but this item is one
      # block, so without set -e only the last command in it would be read and
      # a failing title lint would pass the job.
      set -e
      set -o pipefail
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        section_start "title" "Linting the merge request title"
        printf '%s\n' "$CI_MERGE_REQUEST_TITLE" | npm run --silent lint:commit
        section_end "title"
        section_start "commit" "Linting the merge request commit range"
        npm run lint:commit -- --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to HEAD
        section_end "commit"
      else
        # An all-zero sha is what GitLab passes for the first push of a branch,
        # and a force-push leaves a sha this clone may no longer hold. Neither
        # is a usable range, so both fall back to the pushed commit alone.
        base="${CI_COMMIT_BEFORE_SHA:-}"
        case "$base" in 0000000000000000000000000000000000000000) base="" ;; esac
        if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
          echo "[WARN] ${base} is not a commit in this clone; linting HEAD alone." >&2
          base=""
        fi
        if [ -n "$base" ]; then
          section_start "commit" "Linting the commits this push added"
          npm run lint:commit -- --from "$base" --to HEAD
        else
          section_start "commit" "Linting the pushed commit"
          npm run lint:commit -- --last
        fi
        section_end "commit"
      fi

# yamllint covers both pipelines and the registry data; actionlint covers the
# GitHub workflow, which nothing on the GitHub side lints before a push. The
# version and its checksum are pinned together: a release asset is mutable
# until it is verified.
lint:yaml:
  stage: lint
  image: python:3.12-slim
  interruptible: true
  variables:
    ACTIONLINT_VERSION: '1.7.12'
    ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  script:
    - section_start "yamllint" "Linting YAML"
    - pip install --quiet yamllint
    - yamllint .gitlab-ci.yml .github/workflows/ modules/
    - section_end "yamllint"
    - section_start "actionlint" "Linting GitHub workflows"
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
    - echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
    - tar -xzf actionlint.tar.gz actionlint
    - ./actionlint -color
    - section_end "actionlint"

test:
  extends: .node
  stage: test
  script:
    - section_start "test" "Running the unit tests"
    - npm run test:junit
    - section_end "test"
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml

# The listing gate. Separated from the unit tests because this job's output is
# what a contributor reads, and burying it under test output costs them the
# answer.
validate:
  extends: .node
  stage: test
  script:
    - section_start "validate" "Validating every registry file"
    - npm run validate
    - section_end "validate"
    - section_start "build" "Checking the committed output against the registry"
    - npm run build:check
    - section_end "build"
    # Not sync:check. It reads fifteen repositories over the network, so a
    # rate limit or a GitHub outage would fail a merge request that changed
    # nothing it touches. The sync runs on a schedule and opens its own
    # merge request; this job stays offline and deterministic.
